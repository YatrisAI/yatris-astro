name: CI

on:
  push:
    branches: [development, 'slice/**']
  # Every PR, including slice PRs stacked on another branch
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run e2e
